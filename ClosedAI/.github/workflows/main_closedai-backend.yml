name: Build and deploy Python backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - "HRAgent_Main/**"
      - ".github/workflows/main_closedai-backend.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: HRAgent_Main
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: HRAgent_Main/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: backend-deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_78FB3CD4450940C0B091EE9FBE6F598B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CE011CD7598D4A72891088C8E64040D5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CC4C3BB08FEC4FD29216605314D5301C }}

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "closedai-backend"
          slot-name: "Production"
          package: backend-deploy

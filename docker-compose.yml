# Unified modular monolith local stack (plan.md Week 1).
# Legacy per-hackathon services: docker-compose.legacy.yml

name: quadranthr

networks:
  quadranthr-net:
    driver: bridge

volumes:
  pgdata:
  azurite-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: quadranthr-postgres
    environment:
      POSTGRES_USER: quadranthr
      POSTGRES_PASSWORD: quadranthr
      POSTGRES_DB: quadranthr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - quadranthr-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quadranthr -d quadranthr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quadranthr-redis
    ports:
      - "6379:6379"
    networks:
      - quadranthr-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: quadranthr-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - quadranthr-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quadranthr-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://quadranthr:quadranthr@postgres:5432/quadranthr
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-me
      LLM_PROVIDER: mock
      CORS_ORIGINS: http://localhost:5170,http://127.0.0.1:5170
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    ports:
      - "8080:8080"
    networks:
      - quadranthr-net
    restart: unless-stopped

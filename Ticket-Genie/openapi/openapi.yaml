components:
  schemas:
    AISettingsPayload:
      properties:
        primary_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Model
          default: gpt-5.2
        fallback_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Fallback Model
          default: gpt-4o-mini
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature
          default: 0.2
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Tokens
          default: 4096
        confidence_threshold:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence Threshold
          default: 0.7
        top_k_chunks:
          anyOf:
          - type: integer
          - type: 'null'
          title: Top K Chunks
          default: 3
        similarity_threshold:
          anyOf:
          - type: number
          - type: 'null'
          title: Similarity Threshold
          default: 0.75
        monthly_budget_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Monthly Budget Usd
          default: 50.0
        telemetry_level:
          anyOf:
          - type: string
          - type: 'null'
          title: Telemetry Level
          default: verbose
        feature_auto_triage:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Feature Auto Triage
          default: true
        feature_chatbot_genie:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Feature Chatbot Genie
          default: true
        feature_suggested_responses:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Feature Suggested Responses
          default: true
        feature_rag_grounding:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Feature Rag Grounding
          default: true
        feature_sla_scoring:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Feature Sla Scoring
          default: true
        feature_issue_clustering:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Feature Issue Clustering
          default: true
        feature_prompt_lru_caching:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Feature Prompt Lru Caching
          default: true
        feature_semantic_dedup:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Feature Semantic Dedup
          default: true
        prompt_cache_ttl:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt Cache Ttl
          default: 1h
      type: object
      title: AISettingsPayload
    AnnouncementCreateRequest:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        content:
          type: string
          maxLength: 10000
          minLength: 1
          title: Content
        category:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Category
          default: General Alert
      type: object
      required:
      - title
      - content
      title: AnnouncementCreateRequest
    AnnouncementMatchRequest:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        description:
          type: string
          maxLength: 10000
          title: Description
          default: ''
      type: object
      required:
      - title
      title: AnnouncementMatchRequest
    AnnouncementSeverityRequest:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        content:
          type: string
          maxLength: 10000
          minLength: 1
          title: Content
        category:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Category
          default: General Alert
      type: object
      required:
      - title
      - content
      title: AnnouncementSeverityRequest
    AzureLoginRequest:
      properties:
        azure_object_id:
          type: string
          title: Azure Object Id
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        id_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Id Token
      type: object
      required:
      - azure_object_id
      title: AzureLoginRequest
    Body_upload_knowledge_document_api_knowledge_documents_post:
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 3
          title: Title
        category:
          type: string
          title: Category
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - title
      - category
      - file
      title: Body_upload_knowledge_document_api_knowledge_documents_post
    ChatAction:
      properties:
        type:
          type: string
          title: Type
        target:
          anyOf:
          - type: string
          - type: 'null'
          title: Target
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        ticket_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Ticket Id
      type: object
      required:
      - type
      title: ChatAction
      description: A machine-actionable follow-up the frontend can execute.
    ChatIntent:
      type: string
      enum:
      - navigation
      - how_to
      - knowledge
      - create_ticket
      - leave_management
      - ticket_status
      - support_issue
      - general
      - reassign_ticket
      - change_priority
      - create_portal_employee
      - start_onboarding
      - create_announcement
      - delete_announcement
      title: ChatIntent
    ChatRequest:
      properties:
        message:
          type: string
          title: Message
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
          default: Employee
        department:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
        history:
          items:
            $ref: '#/components/schemas/ChatTurn'
          type: array
          title: History
        draft:
          anyOf:
          - $ref: '#/components/schemas/TicketDraft'
          - type: 'null'
        onboarding_draft:
          anyOf:
          - $ref: '#/components/schemas/OnboardingDraft'
          - type: 'null'
        active_intent:
          anyOf:
          - $ref: '#/components/schemas/ChatIntent'
          - type: 'null'
        active_request_type:
          anyOf:
          - $ref: '#/components/schemas/RequestType'
          - type: 'null'
        pending_action:
          anyOf:
          - $ref: '#/components/schemas/PendingManagementAction'
          - type: 'null'
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
      type: object
      required:
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        message:
          type: string
          title: Message
        intent:
          $ref: '#/components/schemas/ChatIntent'
        action:
          anyOf:
          - $ref: '#/components/schemas/ChatAction'
          - type: 'null'
        request_type:
          anyOf:
          - $ref: '#/components/schemas/RequestType'
          - type: 'null'
        ticket_draft:
          anyOf:
          - $ref: '#/components/schemas/TicketDraft'
          - type: 'null'
        onboarding_draft:
          anyOf:
          - $ref: '#/components/schemas/OnboardingDraft'
          - type: 'null'
        missing_fields:
          items:
            type: string
          type: array
          title: Missing Fields
        suggestions:
          items:
            type: string
          type: array
          title: Suggestions
        knowledge_verified:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Knowledge Verified
        ready_for_review:
          type: boolean
          title: Ready For Review
          default: false
        pending_action:
          anyOf:
          - $ref: '#/components/schemas/PendingManagementAction'
          - type: 'null'
        ticket_candidates:

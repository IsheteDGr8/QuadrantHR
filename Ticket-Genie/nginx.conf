# ==============================================================================
# TicketGenie - Default Nginx Server Configuration (Dev & Local Fallback)
# For environment-driven deployments, use nginx.conf.template with envsubst
# ==============================================================================

# Dynamic Connection header mapping (only 'upgrade' when Upgrade header is present)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Gzip Compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Healthcheck Endpoint for Load Balancers & Health Probes
    location /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # 2. Reverse proxy API requests to FastAPI backend service
    # Authenticated RAG / SQL / ticket routes must never be served from an
    # NGINX proxy cache. Default cache keys ignore Authorization, so a cached
    # Admin 200 could be replayed to a later user with an expired or weaker token.
    # Identity-aware LRU lives in the app after JWT validation.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events (SSE) dynamic support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward identity headers; do not strip Authorization or cookies
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # IP tracking and HTTPS scheme headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Azure App Service SNI TLS compatibility
        proxy_ssl_server_name on;

        # Timeouts for long-running AI generation / classification requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Approach C: bypass any proxy cache for authenticated API traffic
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        expires -1;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 3. Static frontend assets with fallback and browser caching
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static CSS, JS, fonts, and images for high performance
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
    }
}

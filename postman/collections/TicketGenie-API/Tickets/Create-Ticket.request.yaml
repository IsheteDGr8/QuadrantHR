$kind: http-request
name: Create Ticket
method: POST
url: '{{baseUrl}}/api/tickets'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Sample ticket title",
      "description": "Detailed description of the issue",
      "category": "IT Support",
      "priority": "Medium",
      "department": "IT",
      "preferredDate": null,
      "is_anonymous": false,
      "attachment": null
    }
